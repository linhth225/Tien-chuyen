<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature & Ecosystem Vocabulary (B1) 🌱</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');

        :root {
            --primary: #059669; /* Emerald Green */
            --primary-light: #d1fae5;
            --secondary: #d97706; /* Amber */
            --bg-color: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --font-main: 'Nunito', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: 
                radial-gradient(circle at 10% 20%, #dcfce7 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, #ccfbf1 0%, transparent 20%);
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 750px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(5, 150, 105, 0.15);
            padding: 40px;
            border-top: 8px solid var(--primary);
            text-align: center;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            color: var(--primary);
            font-weight: 900;
            font-size: 1.2em;
            background: var(--primary-light);
            padding: 12px 25px;
            border-radius: 20px;
            border: 2px dashed #34d399;
        }

        .badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .badge-fill { background-color: #fef3c7; color: #d97706; border: 2px solid #fde68a; }
        .badge-mcq { background-color: #e0f2fe; color: #0284c7; border: 2px solid #bae6fd; }

        .instruction {
            font-size: 1.2em;
            color: var(--text-muted);
            font-weight: 800;
            margin-bottom: 20px;
        }

        .question-box {
            margin: 0 0 25px 0;
            padding: 25px 20px;
            background-color: #f8fafc;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
            font-size: 1.6em;
            color: var(--text-main);
            font-weight: 800;
            line-height: 1.5;
        }

        .vietnamese-meaning {
            font-size: 1.8em;
            color: var(--primary);
            font-weight: 900;
            margin-bottom: 15px;
            display: block;
        }

        .hint-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .hint-tag {
            background-color: #f1f5f9;
            color: #475569;
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: 800;
            border: 1px solid #cbd5e1;
        }

        .hint-tag.letter { color: var(--secondary); background-color: #fffbeb; border-color: #fde68a; }

        /* Input for Fill in the blank */
        .input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 70%;
            padding: 16px 20px;
            font-size: 1.5em;
            font-family: inherit;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            text-align: center;
            color: var(--primary);
            font-weight: 900;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.2);
        }

        /* MCQ Options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-btn {
            background-color: #ffffff;
            border: 3px solid #e2e8f0;
            padding: 16px 20px;
            font-size: 1.3em;
            font-family: inherit;
            color: var(--text-main);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 800;
        }

        .option-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background-color: #d1fae5;
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-btn.correct { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        .option-btn.wrong { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; text-decoration: line-through; }

        /* Buttons */
        .submit-btn {
            background-color: var(--secondary);
            color: #ffffff;
            border: none;
            padding: 16px 60px;
            font-size: 1.3em;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #b45309;
            transition: all 0.2s ease;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b45309;
        }

        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }

        /* Explanation Box */
        .explanation-box {
            display: none;
            background-color: #ffffff;
            border: 3px solid #e2e8f0;
            padding: 25px;
            margin-top: 20px;
            border-radius: 16px;
            text-align: left;
            animation: fadeIn 0.4s ease;
        }

        .explanation-box.is-correct { border-color: var(--success); background-color: #ecfdf5; }
        .explanation-box.is-wrong { border-color: var(--error); background-color: #fff1f2; }
        
        .exp-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.4em;
            font-weight: 900;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #cbd5e1;
        }

        .audio-btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.3em;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #047857;
        }

        .audio-btn:hover { transform: translateY(2px); box-shadow: 0 2px 0 #047857; }

        .exp-content {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }

        .word-title { color: var(--primary); font-size: 1.6em; font-weight: 900; }
        .ipa { color: #64748b; font-family: monospace; background-color: #f1f5f9; padding: 4px 10px; border-radius: 8px; margin-left: 10px; font-size: 0.9em; font-weight: bold; }
        
        .meaning-row { margin-top: 15px; font-size: 1.1em; color: var(--text-main); }
        .synonym-row { margin-top: 8px; font-size: 1em; color: var(--text-muted); font-style: italic; }

        .example-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #f8fafc;
            border-left: 5px solid var(--secondary);
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
        }

        .next-btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 16px 50px;
            font-size: 1.3em;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 900;
            display: none;
            margin: 25px auto 0 auto;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #047857;
            transition: all 0.2s;
        }

        .next-btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 #047857; }

        #result-screen { display: none; }
        #result-screen h2 { color: var(--primary); font-size: 2.5em; font-weight: 900; }
        .final-score { font-size: 4.5em; font-weight: 900; color: var(--secondary); margin: 20px 0; }
        
        .restart-btn {
            background-color: var(--secondary);
            color: #fff;
            border: none;
            padding: 18px 50px;
            font-size: 1.3em;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #b45309;
        }
        .restart-btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 #b45309; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-screen">
        <div class="header">
            <span>📚 CÂU: <span id="current-question">1</span>/17</span>
            <span>⭐ ĐIỂM: <span id="score">0</span></span>
        </div>

        <div id="badge-area"></div>
        <div class="instruction" id="instruction">Loading...</div>
        
        <div id="question-area"></div>
        <div id="dynamic-area"></div>
        
        <div class="explanation-box" id="explanation"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Tiếp Tục ➔</button>
    </div>

    <div class="quiz-container" id="result-screen">
        <h2>Tuyệt Vời Quá! 🌱</h2>
        <p style="font-size: 1.2em; color: var(--text-muted); font-weight: bold;">Bạn đã hoàn thành xuất sắc bài học từ vựng tự nhiên.</p>
        <div class="final-score"><span id="final-score"></span> / 170</div>
        <button class="restart-btn" onclick="restartGame()">Luyện Tập Lại 🔄</button>
    </div>

    <script>
        const quizData = [
            // DẠNG 1: FILL IN THE BLANK (TỪ ĐƠN LẺ)
            { type: "fill", word: "colony", pos: "Danh từ (n)", vi: "đàn (côn trùng)", hint: "c", ipa: "/ˈkɒləni/", eng_def: "community", ex: "A colony of ants was found under the old tree." },
            { type: "fill", word: "hive", pos: "Danh từ (n)", vi: "tổ ong", hint: "h", ipa: "/haɪv/", eng_def: "nest, beehive", ex: "The bees returned to the hive at sunset." },
            { type: "fill", word: "pollinate", pos: "Động từ (v)", vi: "thụ phấn", hint: "p", ipa: "/ˈpɒləneɪt/", eng_def: "fertilize", ex: "Bees help pollinate flowers and crops." },
            { type: "fill", word: "deceive", pos: "Động từ (v)", vi: "lừa gạt", hint: "d", ipa: "/dɪˈsiːv/", eng_def: "trick, mislead", ex: "Some animals deceive enemies by pretending to be harmless." },
            { type: "fill", word: "deception", pos: "Danh từ (n)", vi: "sự lừa dối", hint: "d", ipa: "/dɪˈsepʃn/", eng_def: "trickery, deceit", ex: "The animal uses deception to escape predators." },
            { type: "fill", word: "strategy", pos: "Danh từ (n)", vi: "chiến lược", hint: "s", ipa: "/ˈstrætədʒi/", eng_def: "plan, approach", ex: "This strategy helps the species survive harsh winters." },
            { type: "fill", word: "disguise", pos: "Danh từ (n)", vi: "sự cải trang, ngụy trang", hint: "d", ipa: "/dɪsˈɡaɪz/", eng_def: "camouflage, concealment", ex: "The insect uses its color as a disguise." },
            { type: "fill", word: "liquid", pos: "Danh từ (n)", vi: "chất lỏng", hint: "l", ipa: "/ˈlɪkwɪd/", eng_def: "fluid", ex: "The plant releases a sticky liquid to trap insects." },
            { type: "fill", word: "invade", pos: "Động từ (v)", vi: "xâm nhập", hint: "i", ipa: "/ɪnˈveɪd/", eng_def: "enter forcefully, overrun", ex: "These insects invade crops during the summer." },
            { type: "fill", word: "workforce", pos: "Danh từ (n)", vi: "lực lượng lao động", hint: "w", ipa: "/ˈwɜːkfɔːs/", eng_def: "workers, staff", ex: "Worker bees form the main workforce of the hive." },
            { type: "fill", word: "artificial", pos: "Tính từ (adj)", vi: "nhân tạo", hint: "a", ipa: "/ˌɑːtɪˈfɪʃl/", eng_def: "man-made, synthetic", ex: "Artificial habitats are built to protect endangered species." },
            { type: "fill", word: "nutrient", pos: "Danh từ (n)", vi: "chất dinh dưỡng", hint: "n", ipa: "/ˈnjuːtriənt/", eng_def: "nourishment", ex: "Plants absorb nutrients from the soil." },
            { type: "fill", word: "eliminate", pos: "Động từ (v)", vi: "loại bỏ, tiêu diệt", hint: "e", ipa: "/ɪˈlɪmɪneɪt/", eng_def: "remove, get rid of", ex: "Farmers try to eliminate harmful pests." },
            { type: "fill", word: "digest", pos: "Động từ (v)", vi: "tiêu hóa", hint: "d", ipa: "/daɪˈdʒest/", eng_def: "break down", ex: "Humans cannot digest some plant fibres." },
            { type: "fill", word: "delicate", pos: "Tính từ (adj)", vi: "mong manh, tinh tế", hint: "d", ipa: "/ˈdelɪkət/", eng_def: "fragile, sensitive", ex: "The ecosystem is delicate and easily damaged." },

            // DẠNG 2: MCQ (CỤM TỪ / GIỚI TỪ)
            { type: "mcq", q: "Scientists are concerned ________ climate change.", options: ["about", "for", "with", "to"], ans: "about", full: "be concerned about", pos: "Cụm từ (phrase)", vi: "lo ngại về", ipa: "/bi kənˈsɜːnd əˈbaʊt/", eng_def: "worry about, care about", ex: "Scientists are concerned about climate change." },
            { type: "mcq", q: "New farming methods help ________ food shortage.", options: ["address", "direct", "speak", "point"], ans: "address", full: "address food shortage", pos: "Cụm từ (phrase)", vi: "giải quyết tình trạng thiếu lương thực", ipa: "/əˈdres fuːd ˈʃɔːtɪdʒ/", eng_def: "tackle hunger, solve food scarcity", ex: "New farming methods help address food shortage." }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionText = null;
        let selectedOptionBtn = null;

        const questionAreaEl = document.getElementById("question-area");
        const dynamicAreaEl = document.getElementById("dynamic-area");
        const explanationEl = document.getElementById("explanation");
        const nextBtn = document.getElementById("next-btn");
        const scoreEl = document.getElementById("score");
        const currentQEl = document.getElementById("current-question");
        const badgeAreaEl = document.getElementById("badge-area");
        const instructionEl = document.getElementById("instruction");

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(isCorrect) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (isCorrect) {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.4);
            } else {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(250, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-GB'; 
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                const resultScreen = document.getElementById("result-screen");
                if (resultScreen.style.display === "block") return;

                if (nextBtn.style.display === "block") {
                    event.preventDefault();
                    nextQuestion();
                } else {
                    const submitBtn = document.getElementById("submit-btn");
                    if (submitBtn && submitBtn.style.display !== "none" && !submitBtn.disabled) {
                        event.preventDefault();
                        if (currentQuestions[currentQuestionIndex].type === "mcq") {
                            checkMCQ();
                        } else {
                            checkFill();
                        }
                    }
                }
            }
        });

        function initGame() {
            document.body.addEventListener('click', initAudio, { once: true });
            
            // Xáo trộn ngẫu nhiên tất cả các câu
            currentQuestions = [...quizData].sort(() => Math.random() - 0.5);
            
            currentQuestionIndex = 0;
            score = 0;
            scoreEl.innerText = score;
            document.getElementById("quiz-screen").style.display = "block";
            document.getElementById("result-screen").style.display = "none";
            loadQuestion();
        }

        function loadQuestion() {
            nextBtn.style.display = "none";
            explanationEl.style.display = "none";
            questionAreaEl.innerHTML = "";
            dynamicAreaEl.innerHTML = "";
            selectedOptionText = null;
            selectedOptionBtn = null;
            
            const item = currentQuestions[currentQuestionIndex];
            currentQEl.innerText = currentQuestionIndex + 1;

            if (item.type === "mcq") {
                badgeAreaEl.innerHTML = `<span class="badge badge-mcq">NGỮ PHÁP & CỤM TỪ (MCQ)</span>`;
                instructionEl.innerText = "Chọn từ đúng để điền vào chỗ trống trong câu sau:";
                
                const formattedQ = item.q.replace("________", `<span style="color: var(--secondary); border-bottom: 3px dashed var(--secondary); padding: 0 25px;">?</span>`);
                questionAreaEl.innerHTML = `<div class="question-box">${formattedQ}</div>`;

                const optionsContainer = document.createElement('div');
                optionsContainer.className = "options-grid";
                
                item.options.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.innerText = opt;
                    if(opt === item.ans) btn.dataset.correct = "true";
                    btn.onclick = () => {
                        initAudio();
                        const allBtns = optionsContainer.querySelectorAll('.option-btn');
                        allBtns.forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedOptionText = opt;
                        selectedOptionBtn = btn;
                        
                        const submitBtn = document.getElementById("submit-btn");
                        if(submitBtn) submitBtn.disabled = false;
                    };
                    optionsContainer.appendChild(btn);
                });
                dynamicAreaEl.appendChild(optionsContainer);
                
                const submitDiv = document.createElement('div');
                submitDiv.innerHTML = `<button class="submit-btn" id="submit-btn" onclick="checkMCQ()" disabled>Kiểm tra đáp án</button>`;
                dynamicAreaEl.appendChild(submitDiv);

            } else {
                badgeAreaEl.innerHTML = `<span class="badge badge-fill">TỪ VỰNG (ĐIỀN TỪ)</span>`;
                instructionEl.innerText = "Gõ từ tiếng Anh tương ứng với nghĩa dưới đây:";
                
                questionAreaEl.innerHTML = `
                    <div class="vietnamese-meaning">🇻🇳 ${item.vi}</div>
                    <div class="hint-bar">
                        <span class="hint-tag">📚 Loại từ: ${item.pos}</span>
                        <span class="hint-tag letter">💡 Bắt đầu bằng chữ: "${item.hint.toUpperCase()}"</span>
                    </div>
                `;

                dynamicAreaEl.innerHTML = `
                    <div class="input-area">
                        <input type="text" id="blank-input" placeholder="Nhập từ tiếng Anh..." autocomplete="off">
                        <button class="submit-btn" id="submit-btn" onclick="checkFill()">Kiểm tra đáp án</button>
                    </div>
                `;
                setTimeout(() => {
                    const inp = document.getElementById("blank-input");
                    if(inp) inp.focus();
                }, 100);
            }
        }

        function checkMCQ() {
            if (!selectedOptionText) return;

            initAudio();
            const item = currentQuestions[currentQuestionIndex];
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(btn => btn.disabled = true);
            document.getElementById("submit-btn").style.display = "none";

            let isCorrect = selectedOptionText === item.ans;
            let headerHTML = "";

            if (isCorrect) {
                selectedOptionBtn.classList.remove("selected");
                selectedOptionBtn.classList.add("correct");
                score += 10;
                scoreEl.innerText = score;
                playSound(true);
                explanationEl.className = "explanation-box is-correct";
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--success);">🎉 Chính xác tuyệt đối!</span>
                        <button class='audio-btn' onclick="speakWord('${item.full.replace(/'/g, "\'")}')">🔊</button>
                    </div>`;
            } else {
                selectedOptionBtn.classList.remove("selected");
                selectedOptionBtn.classList.add("wrong");
                buttons.forEach(btn => {
                    if(btn.dataset.correct === "true") btn.classList.add("correct");
                });
                playSound(false);
                explanationEl.className = "explanation-box is-wrong";
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--error);">❌ Chưa đúng rồi! Đáp án là: <b>${item.ans}</b></span>
                        <button class='audio-btn' onclick="speakWord('${item.full.replace(/'/g, "\'")}')">🔊</button>
                    </div>`;
            }

            speakWord(item.full);

            const expHTML = `
                ${headerHTML}
                <div class='exp-content'>
                    <span class='word-title'>${item.full}</span> <span class='ipa'>${item.ipa}</span>
                    <div class="meaning-row">🇻🇳 Nghĩa: <b>${item.vi}</b></div>
                    <div class="synonym-row">🇬🇧 Tiếng Anh: ${item.eng_def}</div>
                    <div class="example-box">
                        📖 <b>Ví dụ:</b> "${item.ex}"
                    </div>
                </div>
            `;
            
            explanationEl.innerHTML = expHTML;
            explanationEl.style.display = "block";
            nextBtn.style.display = "block";
            setTimeout(() => { nextBtn.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
        }

        function checkFill() {
            initAudio();
            const item = currentQuestions[currentQuestionIndex];
            const inputEl = document.getElementById("blank-input");
            const submitBtn = document.getElementById("submit-btn");

            const userAns = inputEl.value.trim().toLowerCase();
            const correctAns = item.word.toLowerCase();

            if (userAns === "") {
                inputEl.style.animation = "shake 0.3s";
                setTimeout(() => inputEl.style.animation = "", 300);
                return;
            }

            inputEl.disabled = true;
            submitBtn.style.display = "none";

            let isCorrect = userAns === correctAns;
            let headerHTML = "";

            if (isCorrect) {
                score += 10;
                scoreEl.innerText = score;
                playSound(true);
                explanationEl.className = "explanation-box is-correct";
                inputEl.style.borderColor = "var(--success)";
                inputEl.style.color = "var(--success)";
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--success);">🎉 Bạn đã gõ đúng!</span>
                        <button class='audio-btn' onclick="speakWord('${item.word.replace(/'/g, "\'")}')">🔊</button>
                    </div>`;
            } else {
                playSound(false);
                explanationEl.className = "explanation-box is-wrong";
                inputEl.style.borderColor = "var(--error)";
                inputEl.style.textDecoration = "line-through";
                inputEl.style.color = "var(--error)";
                headerHTML = `
                    <div class='exp-header'>
                        <span style="color: var(--error);">❌ Từ đúng phải là: <b>${item.word}</b></span>
                        <button class='audio-btn' onclick="speakWord('${item.word.replace(/'/g, "\'")}')">🔊</button>
                    </div>`;
            }

            speakWord(item.word);

            const expHTML = `
                ${headerHTML}
                <div class='exp-content'>
                    <span class='word-title'>${item.word}</span> <span class='ipa'>${item.ipa}</span>
                    <div class="meaning-row">🇻🇳 Nghĩa: <b>${item.vi}</b> (${item.pos})</div>
                    <div class="synonym-row">🇬🇧 Tiếng Anh: ${item.eng_def}</div>
                    <div class="example-box">
                        📖 <b>Ví dụ ngữ cảnh:</b><br>"${item.ex}"
                    </div>
                </div>
            `;
            
            explanationEl.innerHTML = expHTML;
            explanationEl.style.display = "block";
            nextBtn.style.display = "block";
            setTimeout(() => { nextBtn.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                document.getElementById("quiz-screen").style.display = "none";
                document.getElementById("result-screen").style.display = "block";
                document.getElementById("final-score").innerText = score;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function restartGame() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
